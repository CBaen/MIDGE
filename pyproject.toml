[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "midge"
version = "0.1.0"
description = "MIDGE - Market Intelligence Driven by Generative Exploration (Mae for trading)"
requires-python = ">=3.12"
dependencies = [
    # Agent-based modeling
    "mesa>=3.4",
    # Neural networks and RL
    "torch>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    # Vector search (in-memory, no server)
    "faiss-cpu>=1.7",
    # API layer
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    # Configuration
    "pyyaml>=6.0",
    # Monitoring
    "prometheus-client>=0.17",
    "structlog>=23.1",
    # External API access
    "httpx>=0.25",
    "anthropic>=0.40",
    # Environment configuration
    "python-dotenv>=1.0",
    # Market intelligence (MIDGE-specific)
    "requests>=2.31",
    "yfinance>=0.2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.5",
    "psutil>=5.9",
    "ruff>=0.1",
    "mypy>=1.5",
]
gpu = [
    "faiss-gpu>=1.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (full organism bootstrap — deselect with -m 'not slow')",
]
